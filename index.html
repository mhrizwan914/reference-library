<style>
  /* ============================================================
     BASE
     ============================================================ */
  html, body { background: #1B1917; color: #F2ECE1; }
  body { font-family: 'IBM Plex Sans', system-ui, sans-serif; }
  * { box-sizing: border-box; }

  ::selection { background: #F2B705; color: #1B1917; }

  /* Focus rings — always visible on keyboard nav, never on mouse click */
  :focus { outline: none; }
  :focus-visible {
    outline: 2px solid #F2B705;
    outline-offset: 2px;
    border-radius: 2px;
  }

  /* Scrollbars: quiet, warm-neutral */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #3A3532; border-radius: 999px; border: 2px solid #1B1917; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
  }

  /* ============================================================
     MOTION PRIMITIVES
     ============================================================ */
  @keyframes toast-in {
    from { opacity: 0; transform: translateY(8px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes fade-in {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes modal-in {
    from { opacity: 0; transform: scale(0.96) translateY(6px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  .anim-toast { animation: toast-in 0.22s cubic-bezier(.2,.8,.2,1) both; }
  .anim-fade { animation: fade-in 0.16s ease-out both; }
  .anim-modal { animation: modal-in 0.18s cubic-bezier(.2,.8,.2,1) both; }

  .drawer-panel {
    transition: transform 0.28s cubic-bezier(.2,.8,.2,1);
    transform: translateX(100%);
  }
  .drawer-panel.drawer-open { transform: translateX(0); }
  .drawer-backdrop {
    transition: opacity 0.28s ease;
    opacity: 0;
  }
  .drawer-backdrop.drawer-open { opacity: 1; }

  /* ============================================================
     DEMO-ONLY CONTROL (role switcher) — deliberately marked as
     not-part-of-the-product: dashed outline, muted label.
     ============================================================ */
  .demo-control {
    border: 1px dashed #6B6155;
    background: repeating-linear-gradient(135deg, rgba(242,236,225,0.02) 0 6px, transparent 6px 12px);
  }
  .demo-tag {
    font-size: 0.5625rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #96897A;
  }

  /* ============================================================
     TAG CHIPS — style vs client must read as visually distinct
     families at a glance.
     ============================================================ */
  .tag-style {
    border: 1px solid rgba(242,236,225,0.22);
    background: transparent;
    color: #F2ECE1;
    border-radius: 999px;
  }
  .tag-style:hover { background: rgba(242,236,225,0.08); }
  .tag-style.tag-active {
    background: #F2ECE1;
    color: #1B1917;
    border-color: #F2ECE1;
  }

  .tag-client {
    border: 1px solid rgba(242,183,5,0.35);
    background: rgba(242,183,5,0.1);
    color: #F2B705;
    border-radius: 4px;
  }
  .tag-client:hover { background: rgba(242,183,5,0.18); }
  .tag-client.tag-active {
    background: #F2B705;
    color: #1B1917;
    border-color: #F2B705;
  }

  /* ============================================================
     THUMBNAIL — the signature moment. Deterministic per clip ID.
     Six abstract "leader" pattern recipes, colored via CSS custom
     properties (--c1/--c2/--c3) computed from a hash of the ID.
     ============================================================ */
  .thumb {
    position: relative;
    aspect-ratio: 9 / 16;
    overflow: hidden;
    border-radius: 6px;
    background-color: var(--c1, #302C29);
    isolation: isolate;
  }
  .thumb::after {
    /* film-grain texture, subtle, on every pattern */
    content: '';
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(242,236,225,0.5) 0.5px, transparent 0.5px);
    background-size: 3px 3px;
    opacity: 0.05;
    mix-blend-mode: overlay;
    pointer-events: none;
  }
  .thumb-p0 {
    background-image: repeating-linear-gradient(52deg, var(--c1) 0 14px, var(--c2) 14px 28px);
  }
  .thumb-p1 {
    background-image:
      radial-gradient(circle at 50% 42%, var(--c3) 0 6%, transparent 7%),
      radial-gradient(circle at 50% 42%, transparent 0 16%, var(--c2) 17% 24%, transparent 25%),
      radial-gradient(circle at 50% 42%, transparent 0 34%, var(--c2) 35% 40%, transparent 41%);
    background-color: var(--c1);
  }
  .thumb-p2 {
    background-image: radial-gradient(var(--c3) 1.5px, transparent 1.6px);
    background-size: 13px 13px;
    background-color: var(--c1);
    background-position: 0 0, 6.5px 6.5px;
  }
  .thumb-p3 {
    background-image:
      repeating-linear-gradient(0deg, var(--c2) 0 8%, transparent 8% 16%),
      linear-gradient(var(--c1), var(--c1));
    background-size: 100% 100%;
  }
  .thumb-p4 {
    background-image: repeating-linear-gradient(135deg, var(--c1) 0 22px, var(--c2) 22px 44px, var(--c3) 44px 66px);
  }
  .thumb-p5 {
    background-image:
      linear-gradient(160deg, transparent 46%, var(--c2) 47% 53%, transparent 54%),
      linear-gradient(20deg, transparent 46%, var(--c3) 47% 51%, transparent 52%);
    background-color: var(--c1);
  }
  .thumb-sprockets {
    position: absolute; top: 0; bottom: 0; width: 9px;
    background-image: linear-gradient(var(--c1), var(--c1)),
      repeating-linear-gradient(0deg, transparent 0 6px, rgba(27,25,23,0.55) 6px 11px, transparent 11px 17px);
    opacity: 0.9;
  }

  /* Corner frame-marks — camera-framing crop brackets */
  .fmark { position: absolute; width: 11px; height: 11px; border-color: rgba(242,236,225,0.55); opacity: 0.8; }
  .fmark-tl { top: 6px; left: 6px; border-top: 1.5px solid; border-left: 1.5px solid; }
  .fmark-tr { top: 6px; right: 6px; border-top: 1.5px solid; border-right: 1.5px solid; }
  .fmark-bl { bottom: 6px; left: 6px; border-bottom: 1.5px solid; border-left: 1.5px solid; }
  .fmark-br { bottom: 6px; right: 6px; border-bottom: 1.5px solid; border-right: 1.5px solid; }

  /* Reference ID — the slate-marking signature typography */
  .ref-id {
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
  }

  /* Segmented control (grid/list, role switcher base) */
  .seg-btn { transition: background-color .15s ease, color .15s ease; }

  /* Tag input component */
  .tag-input-wrap:focus-within {
    outline: 2px solid #F2B705;
    outline-offset: 1px;
  }

  .card-hover { transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
  .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.35); border-color: rgba(242,236,225,0.25); }

  .line-clamp-2 {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .truncate-1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body class="bg-ink text-paper font-sans antialiased min-h-screen">

<div id="toast-root" class="fixed bottom-4 inset-x-0 z-[100] flex flex-col items-center gap-2 px-4 pointer-events-none"></div>
<div id="app"></div>

<script>
/* ================================================================
   REFERENCE LIBRARY — prototype application
   One file. No build step. Vanilla JS. Hash routing. In-memory state.
   Sections:
     1. STATE
     2. SEED DATA
     3. UTILITIES (escaping, dates, hashing)
     4. PLATFORM DETECTION
     5. PERMISSIONS
     6. FILTERING
     7. THUMBNAIL GENERATION
     8. ROUTING
     9. RENDERING
     10. EVENT HANDLERS
     11. INIT
   ================================================================ */

/* ----------------------------------------------------------------
   1. STATE
   ---------------------------------------------------------------- */
const state = {
  signedIn: false,
  currentUser: null,          // { name, email }
  viewingAsRole: 'admin',     // demo role switcher: 'admin' | 'member' — independent of the account's real role
  bannerDismissed: false,
  view: 'grid',               // 'grid' | 'list'
  filters: { search: '', styleTags: [], clientTags: [] },
  clips: [],                  // filled from seed below
  members: [],                // filled from seed below
  styleTagVocab: [],
  clientTagVocab: [],
  drawer: null,               // { type: 'detail'|'add', clipId? }
  modal: null,                // { type: 'forgotPassword'|'inviteMember'|'confirmDelete'|'confirmPause'|'confirmRemove', ...payload }
  toasts: [],
  loginErrors: {},
  inviteErrors: {},
  addClipErrors: {},
  inviteMemberErrors: {},
  forgotPasswordSent: false,
  addClipDraft: { url: '', styleTags: [], clientTags: [], notes: '' },
  addClipTagInput: { style: '', client: '' },
  loginDraft: { email: '' },
  inviteDraft: { name: '' },
  inviteMemberDraft: { email: '' },
  lastFocused: null,          // element to restore focus to after closing an overlay
  lastFocusedSelector: null,  // re-query fallback when that element got replaced by a re-render
  avatarMenuOpen: false,
};

/* ----------------------------------------------------------------
   2. SEED DATA
   ---------------------------------------------------------------- */
const SEED_MEMBERS = [
  { id: 'u1', name: 'Ayesha', email: 'ayesha@studio.com', role: 'admin',  status: 'active',  joinedAt: '2026-03-02T09:00:00' },
  { id: 'u2', name: 'Bilal',  email: 'bilal@studio.com',  role: 'member', status: 'active',  joinedAt: '2026-04-11T09:00:00' },
  { id: 'u3', name: 'Danish', email: 'danish@example.com',role: 'member', status: 'active',  joinedAt: '2026-05-06T09:00:00' },
  { id: 'u4', name: 'Sana',   email: 'sana@studio.com',   role: 'member', status: 'active',  joinedAt: '2026-05-20T09:00:00' },
  { id: 'u5', name: 'Farhan', email: 'farhan@studio.com', role: 'member', status: 'paused',  joinedAt: '2026-06-01T09:00:00' },
];

const SEED_STYLE_TAGS = ['transition','cinematic','silly','hook','b-roll','text-overlay','slow-mo','trending-audio'];
const SEED_CLIENT_TAGS = ['TPC','Harbourline Realty','Kettlebell Co'];

// [id, platform, url, styleTags, clientTag|null, notes|null, addedBy, createdAt]
const SEED_CLIPS_RAW = [
  ['PT-0001','instagram','https://www.instagram.com/reel/C8xK2mLpQrs/', ['hook','trending-audio'], 'Kettlebell Co', 'steal the audio not the edit', 'Ayesha', '2026-08-10T11:20:00'],
  ['PT-0002','tiktok','https://www.tiktok.com/@studioname/video/7284920184729', ['b-roll','cinematic'], 'Harbourline Realty', 'good whip pan at 0:04', 'Bilal', '2026-07-15T14:05:00'],
  ['PT-0003','instagram','https://www.instagram.com/reel/C9mZ1nQwXyz/', ['transition','silly'], 'TPC', 'text timing is the whole trick here', 'Danish', '2026-08-18T09:40:00'],
  ['PT-0004','tiktok','https://www.tiktok.com/@wearestudio/video/7291837465021', ['slow-mo','cinematic','b-roll'], 'Harbourline Realty', null, 'Ayesha', '2026-07-22T16:15:00'],
  ['PT-0005','instagram','https://www.instagram.com/reel/C7pQ4rXaB12/', ['hook','text-overlay'], null, 're-watch for the pattern interrupt at open', 'Sana', '2026-08-05T10:00:00'],
  ['PT-0006','instagram','https://www.instagram.com/reel/C8yT6sLmN34/', ['trending-audio','silly'], 'Kettlebell Co', 'client loved this format, do more like it', 'Ayesha', '2026-07-30T13:30:00'],
  ['PT-0007','tiktok','https://www.tiktok.com/@cliptank/video/7298374651029', ['transition','hook'], 'TPC', null, 'Bilal', '2026-08-20T08:50:00'],
  ['PT-0008','instagram','https://www.instagram.com/reel/C6vB2dKpL56/', ['b-roll','slow-mo'], 'Harbourline Realty', 'drone pass, license check before reuse', 'Danish', '2026-07-13T15:45:00'],
  ['PT-0009','tiktok','https://www.tiktok.com/@studioname/video/7276549382910', ['silly','trending-audio','hook'], null, 'caption punchline lands late, watch pacing', 'Sana', '2026-08-12T12:10:00'],
  ['PT-0010','instagram','https://www.instagram.com/reel/C9wR7tMoP78/', ['cinematic','text-overlay'], 'TPC', 'grade is warm, matches our LUT', 'Ayesha', '2026-08-01T09:25:00'],
  ['PT-0011','instagram','https://www.instagram.com/reel/C7xN3fGhJ90/', ['transition','b-roll'], 'Kettlebell Co', null, 'Bilal', '2026-07-18T17:00:00'],
  ['PT-0012','tiktok','https://www.tiktok.com/@wearestudio/video/7302938475610', ['hook','slow-mo'], 'Harbourline Realty', 'hook works even muted', 'Ayesha', '2026-08-21T19:35:00'],
  ['PT-0013','tiktok','https://www.tiktok.com/@cliptank/video/7269481037562', ['text-overlay','silly','transition'], 'TPC', 'good template for founder-facing content', 'Danish', '2026-07-25T11:05:00'],
  ['PT-0014','instagram','https://www.instagram.com/reel/C8aL5eYtR12/', ['cinematic','b-roll'], 'Kettlebell Co', 'reference for the new studio walkthrough', 'Sana', '2026-08-08T14:50:00'],
];

function buildSeedClips() {
  return SEED_CLIPS_RAW.map(row => ({
    id: row[0], platform: row[1], url: row[2],
    styleTags: row[3].slice(), clientTags: row[4] ? [row[4]] : [],
    notes: row[5], addedBy: row[6], createdAt: row[7],
  }));
}

function seedState() {
  state.clips = buildSeedClips();
  state.members = SEED_MEMBERS.map(m => ({ ...m }));
  state.styleTagVocab = SEED_STYLE_TAGS.slice();
  state.clientTagVocab = SEED_CLIENT_TAGS.slice();
}

/* ----------------------------------------------------------------
   3. UTILITIES
   ---------------------------------------------------------------- */
function esc(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

function hashStr(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = (h << 5) - h + str.charCodeAt(i);
    h |= 0;
  }
  return Math.abs(h);
}

function formatRelative(iso) {
  const then = new Date(iso).getTime();
  const now = Date.now();
  const diffMs = Math.max(0, now - then);
  const min = Math.floor(diffMs / 60000);
  if (min < 1) return 'just now';
  if (min < 60) return min + (min === 1 ? ' minute ago' : ' minutes ago');
  const hr = Math.floor(min / 60);
  if (hr < 24) return hr + (hr === 1 ? ' hour ago' : ' hours ago');
  const day = Math.floor(hr / 24);
  if (day < 7) return day + (day === 1 ? ' day ago' : ' days ago');
  const wk = Math.floor(day / 7);
  if (wk < 5) return wk + (wk === 1 ? ' week ago' : ' weeks ago');
  const mo = Math.floor(day / 30);
  if (mo < 1) return 'just now';
  return mo + (mo === 1 ? ' month ago' : ' months ago');
}

function formatAbsolute(iso) {
  const d = new Date(iso);
  const datePart = d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
  const timePart = d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  return datePart + ' at ' + timePart;
}

function nextClipId() {
  let max = 0;
  state.clips.forEach(c => {
    const n = parseInt(c.id.split('-')[1], 10);
    if (n > max) max = n;
  });
  return 'PT-' + String(max + 1).padStart(4, '0');
}

function uid(prefix) {
  return prefix + Math.floor(hashStr(prefix + state.clips.length + state.members.length + Object.keys(state).length + Date.now()) % 100000);
}

/* ----------------------------------------------------------------
   4. PLATFORM DETECTION
   ---------------------------------------------------------------- */
function detectPlatform(rawUrl) {
  if (!rawUrl || !rawUrl.trim()) return null;
  let hostname = null;
  try { hostname = new URL(rawUrl).hostname.toLowerCase(); }
  catch (e) {
    try { hostname = new URL('https://' + rawUrl).hostname.toLowerCase(); }
    catch (e2) { return 'unrecognized'; }
  }
  if (hostname === 'instagram.com' || hostname === 'www.instagram.com') return 'instagram';
  if (hostname === 'tiktok.com' || hostname === 'www.tiktok.com' || hostname === 'vm.tiktok.com') return 'tiktok';
  return 'unrecognized';
}

function platformLabel(p) {
  if (p === 'instagram') return 'Instagram';
  if (p === 'tiktok') return 'TikTok';
  if (p === 'unrecognized') return 'Not recognised';
  return '';
}

/* ----------------------------------------------------------------
   5. PERMISSIONS
   Exactly two roles. The signed-in identity (state.currentUser)
   determines authorship; the demo "viewing as" toggle determines
   the effective role used for every gate below.
   ---------------------------------------------------------------- */
function can(action, payload) {
  const role = state.viewingAsRole;
  switch (action) {
    case 'addClip':
      return true;
    case 'deleteClip':
      if (!payload) return false;
      if (role === 'admin') return true;
      return !!state.currentUser && payload.addedBy === state.currentUser.name;
    case 'viewTeam':
    case 'manageTeam':
      return role === 'admin';
    default:
      return false;
  }
}

/* ----------------------------------------------------------------
   6. FILTERING
   Search and tag filters combine with AND. Sort is always newest first.
   ---------------------------------------------------------------- */
function getFilteredClips() {
  const { search, styleTags, clientTags } = state.filters;
  const q = search.trim().toLowerCase();
  return state.clips
    .filter(clip => {
      if (styleTags.length && !styleTags.every(t => clip.styleTags.includes(t))) return false;
      if (clientTags.length && !clientTags.every(t => clip.clientTags.includes(t))) return false;
      if (q) {
        const haystack = [clip.id, clip.url, ...clip.styleTags, ...clip.clientTags, clip.notes || '', clip.addedBy]
          .join(' ').toLowerCase();
        if (!haystack.includes(q)) return false;
      }
      return true;
    })
    .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
}

function activeFilterCount() {
  return state.filters.styleTags.length + state.filters.clientTags.length;
}

function toggleStyleTagFilter(tag) {
  const i = state.filters.styleTags.indexOf(tag);
  if (i === -1) state.filters.styleTags.push(tag); else state.filters.styleTags.splice(i, 1);
}
function toggleClientTagFilter(tag) {
  const i = state.filters.clientTags.indexOf(tag);
  if (i === -1) state.filters.clientTags.push(tag); else state.filters.clientTags.splice(i, 1);
}
function clearAllFilters() {
  state.filters.search = '';
  state.filters.styleTags = [];
  state.filters.clientTags = [];
}

/* ----------------------------------------------------------------
   7. THUMBNAIL GENERATION
   Deterministic per clip ID: a hash picks one of six abstract
   "leader" pattern recipes and a harmonized three-tone palette.
   Never a photographic frame — always abstract, always a recognisable
   member of the same "contact sheet" family.
   ---------------------------------------------------------------- */
function thumbnailStyle(clipId) {
  const h = hashStr(clipId);
  const patternIndex = h % 6;
  const hue = h % 360;
  const hue2 = (hue + 34 + (h % 17)) % 360;
  const hue3 = (hue + 200 + (h % 23)) % 360;
  const c1 = `hsl(${hue} 38% 16%)`;
  const c2 = `hsl(${hue2} 46% 34%)`;
  const c3 = `hsl(${hue3} 55% 62%)`;
  return {
    patternClass: 'thumb-p' + patternIndex,
    style: `--c1:${c1};--c2:${c2};--c3:${c3};`,
    hasSprockets: patternIndex === 0 || patternIndex === 4,
  };
}

function renderThumbnail(clip, opts) {
  opts = opts || {};
  const t = thumbnailStyle(clip.id);
  const sizeClasses = opts.size === 'sm' ? 'w-16' : opts.size === 'md' ? 'w-28' : 'w-full';
  const platformInitial = clip.platform === 'instagram' ? 'IG' : clip.platform === 'tiktok' ? 'TT' : '?';
  const platformDot = clip.platform === 'instagram' ? 'bg-ig' : clip.platform === 'tiktok' ? 'bg-tiktok' : 'bg-fogdim';
  return `
    <div class="thumb ${t.patternClass} ${sizeClasses} shrink-0" style="${t.style}">
      ${t.hasSprockets ? `<div class="thumb-sprockets left-0"></div><div class="thumb-sprockets right-0"></div>` : ''}
      <span class="fmark fmark-tl"></span><span class="fmark fmark-tr"></span>
      <span class="fmark fmark-bl"></span><span class="fmark fmark-br"></span>
      <span class="absolute top-1.5 right-1.5 ${platformDot} text-ink text-[0.5625rem] font-bold tracking-wide px-1.5 py-0.5 rounded-sm leading-none">${platformInitial}</span>
      <span class="absolute inset-0 flex items-center justify-center">
        <span class="w-8 h-8 rounded-full bg-ink/45 flex items-center justify-center backdrop-blur-[1px]">
          <svg width="12" height="14" viewBox="0 0 12 14" fill="none" class="ml-0.5"><path d="M1 1L11 7L1 13V1Z" fill="#F2ECE1" fill-opacity="0.9"/></svg>
        </span>
      </span>
    </div>`;
}

/* ----------------------------------------------------------------
   8. ROUTING
   Hash-based. State lives in memory only, so a refresh on any deep
   route naturally falls back to signed-out and the guards below
   redirect sanely — there is nothing to reconcile.
   ---------------------------------------------------------------- */
const KNOWN_ROUTES = ['#/login', '#/invite', '#/library', '#/team'];

function currentRoute() {
  const h = location.hash || '';
  return KNOWN_ROUTES.includes(h) ? h : null;
}

function goTo(hash) {
  if (location.hash === hash) { route(); } else { location.hash = hash; }
}

function redirectTo(hash) {
  history.replaceState(null, '', hash);
  route();
}

function route() {
  let path = currentRoute();
  if (!path) { redirectTo(state.signedIn ? '#/library' : '#/login'); return; }

  if (!state.signedIn && (path === '#/library' || path === '#/team')) {
    redirectTo('#/login');
    return;
  }
  if (state.signedIn && (path === '#/login' || path === '#/invite')) {
    redirectTo('#/library');
    return;
  }
  if (path === '#/team' && !can('viewTeam')) {
    redirectTo('#/library');
    showToast('Only admins can manage the team.');
    return;
  }

  renderScreen(path);
}

/* ----------------------------------------------------------------
   9. RENDERING
   ---------------------------------------------------------------- */

/* ---- top-level dispatch ---- */
function renderScreen(path) {
  let body = '';
  if (path === '#/login') body = renderLoginScreen();
  else if (path === '#/invite') body = renderInviteScreen();
  else if (path === '#/library') body = renderSignedInShell(renderLibraryScreen());
  else if (path === '#/team') body = renderSignedInShell(renderTeamScreen());

  document.getElementById('app').innerHTML = body + renderModalRoot() + renderDrawerRoot();
  renderToasts();
  afterRender();
}

function renderModalRoot() {
  if (!state.modal) return '';
  switch (state.modal.type) {
    case 'forgotPassword': return renderForgotPasswordModal();
    case 'inviteMember': return renderInviteMemberModal();
    case 'confirmDelete': return renderConfirmDeleteModal();
    case 'confirmPause': return renderConfirmPauseModal();
    case 'confirmRemove': return renderConfirmRemoveModal();
    case 'blockedLastAdmin': return renderBlockedLastAdminModal();
    default: return '';
  }
}

function renderDrawerRoot() {
  if (!state.drawer) return '';
  if (state.drawer.type === 'detail') return renderDetailDrawer(state.drawer.clipId);
  if (state.drawer.type === 'add') return renderAddClipDrawer();
  return '';
}

/* ---- toasts (persistent root, updated independently of #app) ---- */
let toastSeq = 0;
function showToast(message) {
  const id = ++toastSeq;
  state.toasts.push({ id, message });
  renderToasts();
  setTimeout(() => {
    state.toasts = state.toasts.filter(t => t.id !== id);
    renderToasts();
  }, 3800);
}
function renderToasts() {
  const root = document.getElementById('toast-root');
  root.innerHTML = state.toasts.map(t => `
    <div class="anim-toast pointer-events-auto bg-paper text-ink text-sm font-medium px-4 py-2.5 rounded-lg shadow-2xl border border-ink/10 max-w-[92vw]" role="status">${esc(t.message)}</div>
  `).join('');
}

function renderActiveFilterChips() {
  const { styleTags, clientTags } = state.filters;
  if (styleTags.length + clientTags.length === 0) return `<div id="active-filter-chips"></div>`;
  const chips = [
    ...styleTags.map(t => renderRemovableChip(t, 'style')),
    ...clientTags.map(t => renderRemovableChip(t, 'client')),
  ].join('');
  const clearAll = (styleTags.length + clientTags.length >= 2)
    ? `<button type="button" data-action="clear-all-filters" class="text-xs text-fog hover:text-amber underline underline-offset-2 ml-1">Clear all</button>`
    : '';
  return `<div id="active-filter-chips" class="flex flex-wrap items-center gap-2">${chips}${clearAll}</div>`;
}

function renderRemovableChip(tag, kind) {
  const cls = kind === 'style' ? 'tag-style' : 'tag-client';
  return `
  <span class="${cls} tag-active inline-flex items-center gap-1.5 text-xs px-2.5 py-1">
    ${esc(tag)}
    <button type="button" data-action="toggle-filter-tag" data-kind="${kind}" data-tag="${esc(tag)}" aria-label="Remove filter ${esc(tag)}" class="hover:opacity-70">
      <svg width="9" height="9" viewBox="0 0 9 9" fill="none"><path d="M1 1L8 8M8 1L1 8" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
  </span>`;
}

function renderClipResultsInner(clips) {
  if (clips.length === 0) return renderNoResults();
  return state.view === 'grid' ? renderClipGrid(clips) : renderClipList(clips);
}

function renderPlatformBadge(platform) {
  if (platform === 'instagram') return `<span class="bg-ig/20 text-ig text-[0.6875rem] font-semibold px-2 py-0.5 rounded-full whitespace-nowrap">Instagram</span>`;
  if (platform === 'tiktok') return `<span class="bg-tiktok/20 text-tiktok text-[0.6875rem] font-semibold px-2 py-0.5 rounded-full whitespace-nowrap">TikTok</span>`;
  return `<span class="bg-fogdim/20 text-fog text-[0.6875rem] font-semibold px-2 py-0.5 rounded-full whitespace-nowrap">Unrecognised</span>`;
}

function renderClipTagButtons(clip) {
  const style = clip.styleTags.map(t => `<button type="button" data-action="toggle-filter-tag" data-kind="style" data-tag="${esc(t)}" class="tag-style ${state.filters.styleTags.includes(t) ? 'tag-active' : ''} text-xs px-2 py-1">${esc(t)}</button>`).join('');

/* ----------------------------------------------------------------
   10. EVENT HANDLERS
   All listeners are delegated on `document`, attached once at init.
   Full-screen re-renders happen through rerender(); the few fields
   the user types into continuously (search, clip URL, tag inputs)
   get surgical, focus-preserving updates instead.
   ---------------------------------------------------------------- */

function rerender() {
  renderScreen(currentRoute() || (state.signedIn ? '#/library' : '#/login'));
}

/* ---- overlay open/close + focus management ---- */
function openModal(modalState) {
  state.lastFocused = document.activeElement;
  state.lastFocusedSelector = getStableSelector(document.activeElement);
  state.modal = modalState;
  rerender();
  focusFirstInOverlay();
}
function openDrawer(drawerState) {
  state.lastFocused = document.activeElement;
  state.lastFocusedSelector = getStableSelector(document.activeElement);
  state.drawer = drawerState;
  rerender();
  focusFirstInOverlay();
  // Rendered closed (see renderDetailDrawer/renderAddClipDrawer); flipping the
  // class on the next frame gives the transform transition a "from" state to
  // animate out of, instead of popping straight into place.
  requestAnimationFrame(() => {
    const panel = document.querySelector('.drawer-panel');
    const backdrop = document.querySelector('.drawer-backdrop');
    if (panel) panel.classList.add('drawer-open');
    if (backdrop) backdrop.classList.add('drawer-open');
  });
}
function closeModal() {
  state.modal = null;
  rerender();
  restoreFocus();
}
let drawerClosing = false;
function closeDrawer() {
  if (!state.drawer || drawerClosing) return;
  const panel = document.querySelector('.drawer-panel');
  const backdrop = document.querySelector('.drawer-backdrop');
  if (panel && backdrop) {
    drawerClosing = true;
    panel.classList.remove('drawer-open');
    backdrop.classList.remove('drawer-open');
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(() => {
      drawerClosing = false;
      state.drawer = null;
      rerender();
      restoreFocus();
    }, prefersReducedMotion ? 0 : 240);
  } else {
    state.drawer = null;
    rerender();
    restoreFocus();
  }
}
/* A full re-render replaces the DOM node the user opened the overlay from, so
   the plain "focus the old element" path always misses. Rebuild a selector for
   its data-action identity up front and re-query after render as a fallback. */
function getStableSelector(el) {
  if (!el || !el.dataset) return null;
  const action = el.dataset.action;
  if (!action) return el.id ? '#' + CSS.escape(el.id) : null;
  let sel = `[data-action="${CSS.escape(action)}"]`;
  if (el.dataset.clipId) sel += `[data-clip-id="${CSS.escape(el.dataset.clipId)}"]`;
  if (el.dataset.memberId) sel += `[data-member-id="${CSS.escape(el.dataset.memberId)}"]`;
  return sel;
}
function restoreFocus() {
  const el = state.lastFocused;
  const selector = state.lastFocusedSelector;
  state.lastFocused = null;
  state.lastFocusedSelector = null;
  if (el && typeof el.focus === 'function' && document.body.contains(el)) {
    try { el.focus(); return; } catch (e) {}
  }
  if (selector) {
    const fallback = document.querySelector(selector);
    if (fallback && typeof fallback.focus === 'function') {
      try { fallback.focus(); } catch (e) {}
    }
  }
}
function getFocusable(container) {
  return Array.from(container.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'))
    .filter(el => !el.disabled && el.offsetParent !== null);
}
function focusFirstInOverlay() {
  const trap = document.querySelector('[data-focus-trap]');
  if (!trap) return;
  const focusable = getFocusable(trap);
  (focusable[0] || trap).focus();
}
function trapFocus(e, container) {
  const focusable = getFocusable(container);
  if (!focusable.length) return;
  const first = focusable[0], last = focusable[focusable.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

/* ---- surgical updates (preserve focus/cursor in live-typing fields) ---- */
function updateClipResults() {
  const el = document.getElementById('clip-results');
  if (el) el.innerHTML = renderClipResultsInner(getFilteredClips());
}
function updatePlatformBadge() {
  const el = document.getElementById('platform-badge');
  if (el) el.innerHTML = renderPlatformDetectBadge(detectPlatform(state.addClipDraft.url));
}
function updateSaveButtonState() {
  const btn = document.getElementById('save-clip-btn');
  if (btn) btn.disabled = !state.addClipDraft.url.trim();
}
function updateTagSuggestions(kind) {
  const el = document.getElementById('tag-suggestions-' + kind);
  if (!el) return;
  const vocab = kind === 'style' ? state.styleTagVocab : state.clientTagVocab;
  const chips = state.addClipDraft[kind + 'Tags'];
  const inputVal = state.addClipTagInput[kind];
  const suggestions = inputVal.trim()
    ? vocab.filter(t => t.toLowerCase().includes(inputVal.trim().toLowerCase()) && !chips.includes(t)).slice(0, 6)
    : [];
  el.innerHTML = suggestions.length
    ? `<div class="mt-1.5 flex flex-wrap gap-1.5">${suggestions.map(t => `<button type="button" data-action="commit-suggested-tag" data-kind="${kind}" data-tag="${esc(t)}" class="text-xs px-2 py-1 rounded-full border border-paper/15 text-fog hover:text-paper hover:border-paper/30">${esc(t)}</button>`).join('')}</div>`
    : '';
}
function updateTagWrap(kind) {
  const wrap = document.getElementById('tag-wrap-' + kind);
  if (!wrap) return;
  const chips = state.addClipDraft[kind + 'Tags'];
  const inputVal = state.addClipTagInput[kind];
  const chipClass = kind === 'style' ? 'tag-style' : 'tag-client';
  wrap.innerHTML = `
    ${chips.map(t => `
      <span class="${chipClass} tag-active inline-flex items-center gap-1 text-xs px-2 py-1">
        ${esc(t)}
        <button type="button" data-action="remove-draft-tag" data-kind="${kind}" data-tag="${esc(t)}" aria-label="Remove ${esc(t)}" class="hover:opacity-70">
          <svg width="8" height="8" viewBox="0 0 8 8" fill="none"><path d="M1 1L7 7M7 1L1 7" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
      </span>`).join('')}
    <input id="tag-input-${kind}" type="text" data-action="tag-text-input" data-kind="${kind}" value="${esc(inputVal)}" placeholder="${chips.length ? 'Add another…' : 'Type to add…'}" class="flex-1 min-w-[100px] bg-transparent text-sm py-1 outline-none">
  `;
  updateTagSuggestions(kind);
  const input = document.getElementById('tag-input-' + kind);
  if (input) input.focus();
}
function commitDraftTag(kind, rawValue) {
  const value = rawValue.trim().replace(/,+$/, '').trim();
  if (!value) { state.addClipTagInput[kind] = ''; updateTagWrap(kind); return; }
  const list = state.addClipDraft[kind + 'Tags'];
  if (!list.includes(value)) list.push(value);
  const vocab = kind === 'style' ? state.styleTagVocab : state.clientTagVocab;
  if (!vocab.includes(value)) vocab.push(value);
  state.addClipTagInput[kind] = '';
  updateTagWrap(kind);
}

/* ---- click ---- */
function onDocumentClick(e) {
  if (e.target.closest('a[target="_blank"]')) return; // real link navigation, not a card click

  let menuWasOpen = false;
  if (state.avatarMenuOpen && !e.target.closest('[data-menu-root]')) {
    state.avatarMenuOpen = false;
    menuWasOpen = true;
  }

  const actionEl = e.target.closest('[data-action]');
  if (!actionEl) {
    if (menuWasOpen) rerender();
    return;
  }

  switch (actionEl.dataset.action) {
    case 'dismiss-banner':
      state.bannerDismissed = true;
      rerender();
      break;

    case 'set-role':
      state.viewingAsRole = actionEl.dataset.role;
      route();
      break;

    case 'goto':
      goTo(actionEl.dataset.route);
      break;

    case 'toggle-avatar-menu':
      state.avatarMenuOpen = !state.avatarMenuOpen;
      rerender();
      break;

    case 'sign-out':
      state.signedIn = false;
      state.currentUser = null;
      state.avatarMenuOpen = false;
      state.loginDraft = { email: '' };
      goTo('#/login');
      break;

    case 'open-forgot-password':
      state.forgotPasswordSent = false;
      openModal({ type: 'forgotPassword' });
      break;

    case 'close-modal':
      closeModal();
      break;

    case 'close-drawer':
      closeDrawer();
      break;

    case 'set-view':
      state.view = actionEl.dataset.view;
      rerender();
      break;

    case 'open-add-clip':
      state.addClipDraft = { url: '', styleTags: [], clientTags: [], notes: '' };
      state.addClipTagInput = { style: '', client: '' };
      state.addClipErrors = {};
      openDrawer({ type: 'add' });
      break;

    case 'open-detail':
      openDrawer({ type: 'detail', clipId: actionEl.dataset.clipId });
      break;

    case 'toggle-filter-tag':
      if (actionEl.dataset.kind === 'style') toggleStyleTagFilter(actionEl.dataset.tag);
      else toggleClientTagFilter(actionEl.dataset.tag);
      rerender();
      break;

    case 'filter-and-close-drawer':
      if (actionEl.dataset.kind === 'style') toggleStyleTagFilter(actionEl.dataset.tag);
      else toggleClientTagFilter(actionEl.dataset.tag);
      state.drawer = null;
      rerender();
      break;

    case 'clear-all-filters':
      state.filters.styleTags = [];
      state.filters.clientTags = [];
      rerender();
      break;

    case 'clear-filters-and-search':
      clearAllFilters();
      rerender();
      break;

    case 'delete-clip': // opens the confirmation dialog; the dialog itself deletes
      openModal({ type: 'confirmDelete', clipId: actionEl.dataset.clipId });
      break;

    case 'confirm-delete-clip': {
      const id = actionEl.dataset.clipId;
      state.clips = state.clips.filter(c => c.id !== id);
      state.drawer = null;
      closeModal();
      showToast('Clip deleted.');
      break;
    }

    case 'commit-suggested-tag': {
      const kind = actionEl.dataset.kind, tag = actionEl.dataset.tag;
      const list = state.addClipDraft[kind + 'Tags'];
      if (!list.includes(tag)) list.push(tag);
      state.addClipTagInput[kind] = '';
      updateTagWrap(kind);
      break;
    }

    case 'remove-draft-tag': {
      const kind = actionEl.dataset.kind, tag = actionEl.dataset.tag;
      state.addClipDraft[kind + 'Tags'] = state.addClipDraft[kind + 'Tags'].filter(t => t !== tag);
      updateTagWrap(kind);
      break;
    }

    case 'save-clip':
      saveNewClip();
      break;

    case 'open-invite-member':
      state.inviteMemberErrors = {};
      state.inviteMemberDraft = { email: '' };
      openModal({ type: 'inviteMember' });
      break;

    case 'open-pause-member': {
      const member = state.members.find(m => m.id === actionEl.dataset.memberId);
      if (!member) break;
      if (isOnlyAdmin(member)) openModal({ type: 'blockedLastAdmin', memberName: member.name, action: 'pause' });
      else openModal({ type: 'confirmPause', memberId: member.id });
      break;
    }

    case 'resume-member': {
      const member = state.members.find(m => m.id === actionEl.dataset.memberId);
      if (!member) break;
      member.status = 'active';
      rerender();
      showToast(member.name + ' can sign in again.');
      break;
    }

    case 'confirm-pause-member': {
      const member = state.members.find(m => m.id === actionEl.dataset.memberId);
      if (member) member.status = 'paused';
      closeModal();
      if (member) showToast(member.name + ' is paused.');
      break;
    }

    case 'open-remove-member': {
      const member = state.members.find(m => m.id === actionEl.dataset.memberId);
      if (!member) break;
      if (isOnlyAdmin(member)) openModal({ type: 'blockedLastAdmin', memberName: member.name, action: 'remove' });
      else openModal({ type: 'confirmRemove', memberId: member.id });
      break;
    }

    case 'confirm-remove-member': {
      const id = actionEl.dataset.memberId;
      const member = state.members.find(m => m.id === id);
      state.members = state.members.filter(m => m.id !== id);
      closeModal();
      if (member) showToast(member.name + ' removed from the team.');
      break;
    }

    default:
      if (menuWasOpen) rerender();
      break;
  }
}

/* ---- live-typing input ---- */
function onDocumentInput(e) {
  const el = e.target;
  if (!el.dataset) return;
  switch (el.dataset.action) {
    case 'search-input':
      state.filters.search = el.value;
      updateClipResults();
      break;
    case 'url-input':
      state.addClipDraft.url = el.value;
      state.addClipErrors = {};
      updatePlatformBadge();
      updateSaveButtonState();
      break;
    case 'tag-text-input':
      state.addClipTagInput[el.dataset.kind] = el.value;
      updateTagSuggestions(el.dataset.kind);
      break;
    case 'notes-input':
      state.addClipDraft.notes = el.value;
      break;
  }
}

/* ---- select changes ---- */
function onDocumentChange(e) {
  const el = e.target;
  if (!el.dataset || el.dataset.action !== 'change-member-role') return;
  const member = state.members.find(m => m.id === el.dataset.memberId);
  if (!member) return;
  const newRole = el.value;
  if (newRole === 'member' && isOnlyAdmin(member)) {
    openModal({ type: 'blockedLastAdmin', memberName: member.name, action: 'demote' });
    return;
  }
  member.role = newRole;
  rerender();
  showToast(member.name + ' is now ' + (newRole === 'admin' ? 'an Admin' : 'a Member') + '.');
}

/* ---- keyboard: escape, card activation, tag commit, focus trap ---- */
function onDocumentKeydown(e) {
  if (e.key === 'Escape') {
    if (state.modal) { closeModal(); return; }
    if (state.drawer) { closeDrawer(); return; }
    if (state.avatarMenuOpen) { state.avatarMenuOpen = false; rerender(); return; }
  }

  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-action="open-detail"]')) {
    e.preventDefault();
    e.target.click();
    return;
  }

  if (e.target.dataset && e.target.dataset.action === 'tag-text-input' && (e.key === 'Enter' || e.key === ',')) {
    e.preventDefault();
    commitDraftTag(e.target.dataset.kind, e.target.value);
    return;
  }

  if (e.key === 'Tab') {
    const trap = document.querySelector('[data-focus-trap]');
    if (trap) trapFocus(e, trap);
  }
}

/* ---- form submission ---- */
function onDocumentSubmit(e) {
  const form = e.target.closest('[data-form]');
  if (!form) return;
  e.preventDefault();
  switch (form.dataset.form) {
    case 'login': handleLoginSubmit(form); break;
    case 'accept-invite': handleAcceptInviteSubmit(form); break;
    case 'forgot-password': handleForgotPasswordSubmit(form); break;
    case 'invite-member': handleInviteMemberSubmit(form); break;
  }
}

function handleLoginSubmit(form) {
  const email = form.querySelector('#login-email').value.trim();
  const password = form.querySelector('#login-password').value;
  state.loginDraft.email = email;
  const errors = {};
  if (!email) errors.email = 'Enter your email.';
  if (!password) errors.password = 'Enter your password.';
  state.loginErrors = errors;
  if (Object.keys(errors).length) {
    rerender();
    const f = document.getElementById(errors.email ? 'login-email' : 'login-password');
    if (f) f.focus();
    return;
  }
  const ayesha = state.members.find(m => m.id === 'u1');
  state.currentUser = { id: ayesha.id, name: ayesha.name, email: email };
  state.signedIn = true;
  state.viewingAsRole = 'admin';
  state.loginErrors = {};
  state.loginDraft = { email: '' };
  goTo('#/library');
}

function handleAcceptInviteSubmit(form) {
  const name = form.querySelector('#invite-name').value.trim();
  const password = form.querySelector('#invite-password').value;
  const confirm = form.querySelector('#invite-password-confirm').value;
  state.inviteDraft.name = name;
  const errors = {};
  if (!name) errors.name = 'Enter your full name.';
  if (!password) errors.password = 'Choose a password.';
  else if (password.length < 8) errors.password = 'Use at least 8 characters.';
  if (!confirm) errors.confirm = 'Confirm your password.';
  else if (password && confirm !== password) errors.confirm = "Passwords don't match.";
  state.inviteErrors = errors;
  if (Object.keys(errors).length) {
    rerender();
    const key = ['name', 'password', 'confirm'].find(k => errors[k]);
    const idMap = { name: 'invite-name', password: 'invite-password', confirm: 'invite-password-confirm' };
    const f = document.getElementById(idMap[key]);
    if (f) f.focus();
    return;
  }
  const email = 'danish@example.com';
  let member = state.members.find(m => m.email === email);
  if (member) { member.status = 'active'; member.name = name; }
  else {
    member = { id: uid('u'), name: name, email: email, role: 'member', status: 'active', joinedAt: new Date().toISOString() };
    state.members.push(member);
  }
  state.currentUser = { id: member.id, name: name, email: email };
  state.signedIn = true;
  state.viewingAsRole = 'member';
  state.inviteErrors = {};
  state.inviteDraft = { name: '' };
  goTo('#/library');
  showToast('Welcome to Reference Library, ' + name.split(' ')[0] + '.');
}

function handleForgotPasswordSubmit(form) {
  state.forgotPasswordSent = true;
  rerender();
  focusFirstInOverlay();
}

function handleInviteMemberSubmit(form) {
  const email = form.querySelector('#invite-member-email').value.trim();
  const role = form.querySelector('#invite-member-role').value;
  state.inviteMemberDraft.email = email;
  const errors = {};
  if (!email) errors.email = 'Enter an email address.';
  else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) errors.email = 'Enter a valid email address.';
  else if (state.members.some(m => m.email.toLowerCase() === email.toLowerCase())) errors.email = 'Someone with that email is already on the team.';
  state.inviteMemberErrors = errors;
  if (Object.keys(errors).length) {
    rerender();
    const f = document.getElementById('invite-member-email');
    if (f) f.focus();
    return;
  }
  state.members.push({
    id: uid('u'), name: email.split('@')[0], email: email, role: role, status: 'invited', joinedAt: new Date().toISOString(),
  });
  state.inviteMemberDraft = { email: '' };
  closeModal();
  showToast('Invite sent to ' + email + '.');
}

function saveNewClip() {
  const draft = state.addClipDraft;
  if (!draft.url.trim()) {
    state.addClipErrors = { url: 'Paste a link before saving.' };
    rerender();
    return;
  }
  const newClip = {
    id: nextClipId(),
    platform: detectPlatform(draft.url),
    url: draft.url.trim(),
    styleTags: draft.styleTags.slice(),
    clientTags: draft.clientTags.slice(),
    notes: draft.notes.trim() ? draft.notes.trim() : null,
    addedBy: state.currentUser.name,
    createdAt: new Date().toISOString(),
  };
  state.clips.unshift(newClip);
  state.addClipErrors = {};
  closeDrawer();
  showToast('Clip added.');
}

/* ----------------------------------------------------------------
   11. INIT
   ---------------------------------------------------------------- */
function afterRender() {
  document.body.style.overflow = (state.modal || state.drawer) ? 'hidden' : '';
}

document.addEventListener('click', onDocumentClick);
document.addEventListener('input', onDocumentInput);
document.addEventListener('change', onDocumentChange);
document.addEventListener('keydown', onDocumentKeydown);
document.addEventListener('submit', onDocumentSubmit);
window.addEventListener('hashchange', route);

seedState();
route();
</script>
</body>
</html>
